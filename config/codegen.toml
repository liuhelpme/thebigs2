# The Bigs 2 — codegen options (included from thebigs2_manifest.toml)
#
# Batch A (on): CR/CTR/XER/r1,r2,r13 kept in C++ locals.
# non_argument_as_local must stay OFF: __finally funclets receive the parent
# frame pointer in r12 (addi r12,r31,N; bl funclet — 1054 sites). As a local,
# r12 never reaches the funclet, which then unwinds with a garbage frame and
# can leak a lock (boot deadlock in the heap/pool allocators).
# skip_msr must stay OFF: ReXGlue turns mtmsrd/mfmsr into the guest's global
# critical-section lock (391 sites in this game); skipping it hangs at boot.
# Batch B (off, riskier): non_volatile_as_local and skip_lr — need
# setjmp/longjmp identified first, since they change what survives a longjmp.

skip_lr = false
skip_msr = false
ctr_as_local = true
xer_as_local = true
cr_as_local = true
reserved_as_local = true
non_argument_as_local = false
non_volatile_as_local = false

# 2K titles of this era ship PDATA-described SEH; enable if codegen reports
# functions with exception scopes or the game crashes in a __try path.
generate_exception_handlers = false

# Fill these in once found (search the disassembly for the CRT setjmp/longjmp
# pair — codegen warns when it hits a longjmp call site it cannot resolve).
# setjmp_address  = 0x00000000
# longjmp_address = 0x00000000

[analysis]
max_jump_extension = 65536
data_region_threshold = 16
large_function_threshold = 1048576
exception_handler_funcs = []
