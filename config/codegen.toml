# The Bigs 2 — codegen options (included from thebigs2_manifest.toml)
#
# Start conservative: every register stays in the guest context so the first
# build is as faithful as possible. Once the game boots and plays, flip the
# *_as_local flags on one at a time and re-test — they are the main perf wins.

skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
cr_as_local = false
reserved_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

# 2K titles of this era ship PDATA-described SEH; enable if codegen reports
# functions with exception scopes or the game crashes in a __try path.
generate_exception_handlers = false

# Fill these in once found (search the disassembly for the CRT setjmp/longjmp
# pair — codegen warns when it hits a longjmp call site it cannot resolve).
# setjmp_address  = 0x00000000
# longjmp_address = 0x00000000

[analysis]
max_jump_extension = 65536
data_region_threshold = 16
large_function_threshold = 1048576
exception_handler_funcs = []
